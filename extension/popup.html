<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll Court</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        color: #f9fafb;
        background: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      h1 {
        margin: 0;
        color: #fbbf24;
        font-size: 18px;
      }

      p {
        margin: 0;
        color: #d1d5db;
        font-size: 12px;
        line-height: 1.4;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .stat {
        padding: 9px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
      }

      .stat span {
        display: block;
        color: #d1d5db;
        font-size: 11px;
      }

      .stat strong {
        display: block;
        margin-top: 3px;
        font-size: 15px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #f9fafb;
        font-size: 12px;
      }

      input {
        width: 100%;
        min-height: 36px;
        padding: 8px 9px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 6px;
        color: #f9fafb;
        background: rgba(255, 255, 255, 0.08);
      }

      button {
        min-height: 38px;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .primary {
        color: #111827;
        background: #fbbf24;
      }

      .secondary {
        color: #f9fafb;
        background: rgba(255, 255, 255, 0.1);
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Scroll Court</h1>
        <p>Ancient philosophers are watching the watch history.</p>
      </header>

      <section class="stats" aria-label="Scroll Court stats">
        <div class="stat"><span>Shorts</span><strong id="watched">0</strong></div>
        <div class="stat"><span>Wisdom</span><strong id="wisdom">50</strong></div>
        <div class="stat"><span>Rank</span><strong id="rank">Doomscroll Defendant</strong></div>
      </section>

      <section class="toggle">
        <span>Panel enabled</span>
        <button class="secondary" id="toggle" type="button">On</button>
      </section>

      <label>
        Demo access code
        <input id="demo-password" type="password" autocomplete="off" placeholder="Matches DEMO_PASSWORD" />
      </label>

      <div class="row">
        <button class="primary" id="save" type="button">Unlock</button>
        <button class="secondary" id="reset" type="button">Reset</button>
      </div>
      <p id="status">Locked receipts use fallback judgment until unlocked.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
